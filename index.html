<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, user-scalable=no">

    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black">
    <meta name="apple-mobile-web-app-title" content="Interval Timer">

    <title>Interval Timer</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #111;
            color: white;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 420px;
            padding: 30px;
            text-align: center;
        }

        h1 {
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            font-size: 18px;
        }

        input {
            width: 100%;
            font-size: 30px;
            padding: 15px;
            text-align: center;
            border-radius: 10px;
            border: none;
            margin-bottom: 25px;
        }

        button {
            width: 100%;
            padding: 18px;
            margin: 8px 0;
            border: none;
            border-radius: 10px;
            font-size: 22px;
            font-weight: bold;
            cursor: pointer;
        }

        #startButton {
            background: #2ecc71;
        }

        #stopButton {
            background: #e74c3c;
        }

        #resetButton {
            background: #777;
        }

        #status {
            margin-top: 25px;
            font-size: 20px;
        }

        #count {
            font-size: 60px;
            margin-top: 25px;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>Interval Timer</h1>

    <label for="intervalInput">
        Interval Seconds
    </label>

    <input
        id="intervalInput"
        type="number"
        value="3.5"
        min="0.1"
        step="0.1"
        inputmode="decimal"
    >

    <button id="startButton">
        START
    </button>

    <button id="stopButton">
        STOP
    </button>

    <button id="resetButton">
        RESET
    </button>

    <div id="status">
        Stopped
    </div>

    <div id="count">
        0
    </div>

</div>

<script>

let timer = null;
let audioContext = null;
let notificationCount = 0;


/*
    Create a short beep using the browser's
    built-in Web Audio system.
*/
function beep() {

    if (!audioContext) {
        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();
    }

    const oscillator = audioContext.createOscillator();
    const gain = audioContext.createGain();

    oscillator.connect(gain);
    gain.connect(audioContext.destination);

    // Beep frequency
    oscillator.frequency.value = 900;

    // Volume
    gain.gain.value = 0.5;

    oscillator.start();

    oscillator.stop(
        audioContext.currentTime + 0.15
    );
}


/*
    Start timer
*/
async function startTimer() {

    const intervalInput =
        document.getElementById("intervalInput");

    const seconds =
        parseFloat(intervalInput.value);

    if (!seconds || seconds <= 0) {

        alert("Enter an interval greater than 0 seconds.");

        return;
    }


    /*
        iPhone requires audio to be enabled
        by a physical user interaction.
    */
    if (!audioContext) {

        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();
    }


    if (audioContext.state === "suspended") {
        await audioContext.resume();
    }


    // Stop existing timer
    if (timer) {
        clearInterval(timer);
    }


    document.getElementById("status").textContent =
        "Running - " + seconds + " seconds";


    /*
        Optional immediate beep when START is pressed.
        Remove this line if you don't want it.
    */
    beep();


    timer = setInterval(() => {

        beep();

        notificationCount++;

        document.getElementById("count").textContent =
            notificationCount;

    }, seconds * 1000);
}


/*
    Stop timer
*/
function stopTimer() {

    if (timer) {

        clearInterval(timer);

        timer = null;
    }

    document.getElementById("status").textContent =
        "Stopped";
}


/*
    Reset timer
*/
function resetTimer() {

    stopTimer();

    notificationCount = 0;

    document.getElementById("count").textContent =
        "0";

    document.getElementById("intervalInput").value =
        "3.5";
}


document
    .getElementById("startButton")
    .addEventListener("click", startTimer);


document
    .getElementById("stopButton")
    .addEventListener("click", stopTimer);


document
    .getElementById("resetButton")
    .addEventListener("click", resetTimer);

</script>

</body>
</html>
